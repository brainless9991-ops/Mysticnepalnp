      <span class="topbar-badge">✅ Live</span>
      <button class="btn-preview" onclick="previewSite()">🔗 View Page</button>
    </div>
  </header>
  <main id="main-content"></main>
</div>

<script>
  // ──────────────────────────────────────────────────────────────
  //  API BASE
  // ──────────────────────────────────────────────────────────────
  const API_BASE = '/api/about';
  const PREVIEW_URL = '/frontend/about/about.html';

  // ──────────────────────────────────────────────────────────────
  //  DEFAULT DATA (nested for editing; flattened before it hits the API)
  // ──────────────────────────────────────────────────────────────

    partners: {

        { name: 'Amet Tours' }, { name: 'Vokalia Co.' }

    },
    cta: {

      text: 'Fusce hic augue velit wisi quibusdam pariatur, iusto primis, nec nemo, rutrum. Vestibulum cumque laudantium. Sit ornare mollitia tenetur, aptent.',

    },

        { stars: '★★★★★', text: 'Far far away, behind the word mountains, far from the countries Vokalia and Consonantia, there live the blind texts.', name: 'Dolor Amet', role: 'Travellers', avatarLetter: 'D', avatarColor: 'var(--accent-red)' }

    },
    footer: {

      ],

  // ──────────────────────────────────────────────────────────────
  //  FLAT <-> NESTED MAPPING (nested shape above <-> flat about_page columns)
  // ──────────────────────────────────────────────────────────────
  function fromRow(row) {
    return {
      hero: { title: row.hero_title, breadcrumb: row.hero_breadcrumb },
      intro: {
        tag: row.intro_tag, heading: row.intro_heading,
        paragraph1: row.intro_paragraph1, paragraph2: row.intro_paragraph2,
        image: row.intro_image, badgeText: row.intro_badge_text,
        features: row.features || []
      },
      values: {
        eyebrow: row.why_eyebrow, heading: row.why_heading, intro: row.why_intro,
        imageMain: row.why_image_main, imageAccent: row.why_image_accent,
        statNumber: row.why_stat_number, statLabel: row.why_stat_label,
        items: row.values || []
      },
      partners: { label: row.partners_label, items: row.partners || [] },
      cta: {
        heading: row.cta_heading, text: row.cta_text,
        btn1Text: row.cta_btn1_text, btn1Link: row.cta_btn1_link,
        btn2Text: row.cta_btn2_text, btn2Link: row.cta_btn2_link
      },
      testimonials: {
        eyebrow: row.testi_eyebrow, heading: row.testi_heading, intro: row.testi_intro,
        items: (row.testimonials || []).map(t => ({
          stars: t.stars, text: t.text, name: t.name, role: t.role,
          avatarLetter: t.avatar_letter, avatarColor: t.avatar_color
        }))
      },
      footer: {
        description: row.footer_description, address: row.footer_address,
        phone: row.footer_phone, email: row.footer_email,
        services: (row.footer_services || []).map(s => ({ label: s.label, link: s.link })),
        news: (row.footer_news || []).map(n => ({ icon: n.icon, title: n.title, date: n.date, link: n.link }))
      }
    };
  }

  function toFlat(d) {
    return {
      hero_title: d.hero.title, hero_breadcrumb: d.hero.breadcrumb,
      intro_tag: d.intro.tag, intro_heading: d.intro.heading,
      intro_paragraph1: d.intro.paragraph1, intro_paragraph2: d.intro.paragraph2,
      intro_image: d.intro.image, intro_badge_text: d.intro.badgeText,
      features: d.intro.features || [],
      why_eyebrow: d.values.eyebrow, why_heading: d.values.heading, why_intro: d.values.intro,
      why_image_main: d.values.imageMain, why_image_accent: d.values.imageAccent,
      why_stat_number: d.values.statNumber, why_stat_label: d.values.statLabel,
      values: d.values.items || [],
      partners_label: d.partners.label, partners: d.partners.items || [],
      cta_heading: d.cta.heading, cta_text: d.cta.text,
      cta_btn1_text: d.cta.btn1Text, cta_btn1_link: d.cta.btn1Link,
      cta_btn2_text: d.cta.btn2Text, cta_btn2_link: d.cta.btn2Link,
      testi_eyebrow: d.testimonials.eyebrow, testi_heading: d.testimonials.heading, testi_intro: d.testimonials.intro,
      testimonials: (d.testimonials.items || []).map(t => ({
        stars: t.stars, text: t.text, name: t.name, role: t.role,
        avatar_letter: t.avatarLetter, avatar_color: t.avatarColor
      })),
      footer_description: d.footer.description, footer_address: d.footer.address,
      footer_phone: d.footer.phone, footer_email: d.footer.email,
      footer_services: (d.footer.services || []).map(s => ({ label: s.label, link: s.link })),
      footer_news: (d.footer.news || []).map(n => ({ icon: n.icon, title: n.title, date: n.date, link: n.link }))
    };
  }

  // ──────────────────────────────────────────────────────────────
  //  MODEL – API INTEGRATION
  // ──────────────────────────────────────────────────────────────
  const Model = {
    _data: null,
    _id: null,

    async load() {
      try {
        const res = await fetch(API_BASE);
        if (!res.ok) throw new Error('Failed to fetch data');
        const data = await res.json();
        if (!data.length) {
          this._data = JSON.parse(JSON.stringify(DEFAULT_MODEL));
          this._id = null;
        } else {
          const row = data[0];
          this._id = row.id;
          this._data = fromRow(row);
        }
        return this._data;
      } catch (err) {
        console.error('Load error:', err);
        showToast('Failed to load data. Using defaults.', 'error');
        this._data = JSON.parse(JSON.stringify(DEFAULT_MODEL));
        this._id = null;
        return this._data;
      }
    },

    async save(data) {
      const payload = toFlat(data);
      let url = API_BASE;
      let method = 'POST';
      if (this._id) {
        url += '/' + this._id;
        method = 'PUT';
      }
      const res = await fetch(url, {
        method,
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      if (!res.ok) throw new Error('Save failed');
      const result = await res.json();
      if (result.id) this._id = result.id;
      this._data = data;
      return result;
    },

    get(section) { return this._data ? this._data[section] : null; },
    set(section, value) {
      if (!this._data) this._data = JSON.parse(JSON.stringify(DEFAULT_MODEL));
      this._data[section] = value;
    },
    all() { return this._data; },

    async reset() {
      try {
        await fetch(API_BASE + '/seed', { method: 'POST' });
      } catch (e) { /* fall through to reload below */ }
      await this.load();
      return this._data;
    }
  };

  // ──────────────────────────────────────────────────────────────
  //  HELPERS
  // ──────────────────────────────────────────────────────────────
  function showToast(msg, type = '') {
    document.querySelectorAll('.toast').forEach(t => t.remove());
    const t = document.createElement('div');
    t.className = 'toast ' + type;
    t.innerHTML = (type === 'error' ? '❌ ' : type === 'warning' ? '⚠️ ' : '✅ ') + msg;
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 3200);
  }
  function toggleSidebar() {
    document.getElementById('sidebar').classList.toggle('open');
    document.getElementById('sidebarOverlay').classList.toggle('open');
  }
  function closeSidebar() {
    document.getElementById('sidebar').classList.remove('open');
    document.getElementById('sidebarOverlay').classList.remove('open');
  }
  function previewSite() { window.open(PREVIEW_URL, '_blank'); }
  async function resetAllData() {
    if (!confirm('Reset the About page to its default content? This cannot be undone.')) return;
    try {
      await Model.reset();
      showToast('Content reset to defaults!', 'warning');
      Router.navigate(Router.current, false);
    } catch (err) {
      showToast('Reset failed: ' + err.message, 'error');
    }
  }
  function escHtml(s) { return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function val(id) { const el = document.getElementById(id); return el ? el.value : ''; }
  function setVal(id, v) { const el = document.getElementById(id); if (el) el.value = v; }

  function field(label, id, value, type='text', extra='') {
    if (type === 'textarea') {
      return `<div class="field"><label>${label}</label><textarea id="${id}" ${extra}>${escHtml(value)}</textarea></div>`;
    }
    return `<div class="field"><label>${label}</label><input type="${type}" id="${id}" value="${escHtml(value)}" ${extra}></div>`;
  }
  function sectionHeader(icon, title, desc) {
    return `<div class="page-header"><div class="page-header-text"><h1>${icon} ${title}</h1><p>${desc}</p></div></div>`;
  }

  // ──────────────────────────────────────────────────────────────
  //  RENDER: DASHBOARD
  // ──────────────────────────────────────────────────────────────
  function renderDashboard(el) {
    const d = Model.all();
    const sections = [
      { route:'hero', icon:'🚀', name:'Hero', desc:'Title & breadcrumb' },
      { route:'intro', icon:'📖', name:'Intro & Features', desc:'Story + 3 feature icons' },
      { route:'values', icon:'💎', name:'Core Values', desc:'Philosophy + value cards' },
      { route:'partners', icon:'🤝', name:'Partners', desc:'"Trusted by" logos bar' },
      { route:'cta', icon:'📣', name:'CTA Banner', desc:'Call-to-action strip' },
      { route:'testimonials', icon:'💬', name:'Testimonials', desc:'Customer review cards' },
      { route:'footer', icon:'🦶', name:'Footer', desc:'Company info, services, news' }
    ];
    const featCount = d.intro?.features?.length || 0;
    const valCount = d.values?.items?.length || 0;
    const partnerCount = d.partners?.items?.length || 0;
    const testiCount = d.testimonials?.items?.length || 0;

    el.innerHTML = `
      ${sectionHeader('📊','Dashboard','Welcome back! Choose a section below to edit the About page content.')}
      <div class="dash-grid">
        <div class="dash-card"><div class="dash-card-icon">🧩</div><div class="dash-card-label">Features</div><div class="dash-card-value">${featCount}</div><div class="dash-card-sub">Intro feature items</div></div>
        <div class="dash-card"><div class="dash-card-icon">💎</div><div class="dash-card-label">Core Values</div><div class="dash-card-value">${valCount}</div><div class="dash-card-sub">Value cards</div></div>
        <div class="dash-card"><div class="dash-card-icon">🤝</div><div class="dash-card-label">Partners</div><div class="dash-card-value">${partnerCount}</div><div class="dash-card-sub">Trusted-by logos</div></div>
        <div class="dash-card"><div class="dash-card-icon">💬</div><div class="dash-card-label">Testimonials</div><div class="dash-card-value">${testiCount}</div><div class="dash-card-sub">Customer reviews</div></div>
      </div>
      <div class="card">
        <div class="card-header"><div class="card-title">🗂️ All Sections — Click to Edit</div></div>
        <div class="dash-sections-grid">
          ${sections.map(s => `<div class="dash-section-card" onclick="Router.navigate('${s.route}')">
            <div class="dsc-icon">${s.icon}</div>
            <div class="dsc-text"><div class="dsc-name">${s.name}</div><div class="dsc-desc">${s.desc}</div></div>
            <div class="dsc-arrow">→</div>
          </div>`).join('')}
        </div>
      </div>`;
  }

  // ──────────────────────────────────────────────────────────────
  //  RENDER: HERO
  // ──────────────────────────────────────────────────────────────
  function renderHero(el) {
    const d = Model.get('hero') || {};
    el.innerHTML = `
      ${sectionHeader('🚀','Hero Section','The banner at the top of the About page.')}
      <div class="card">
        <div class="card-header"><div class="card-title">📝 Hero Content</div></div>
        <div class="form-grid cols-2">
          ${field('Title','hero_title', d.title)}
          ${field('Breadcrumb','hero_breadcrumb', d.breadcrumb)}
        </div>
        <div class="divider"></div>
        <button class="btn btn-primary" onclick="saveHero()">💾 Save Hero</button>
      </div>`;
  }
  async function saveHero() {
    const d = Model.all();
    d.hero = { title: val('hero_title'), breadcrumb: val('hero_breadcrumb') };
    try { await Model.save(d); showToast('Hero saved!'); }
    catch (err) { showToast('Error: ' + err.message, 'error'); }
  }

  // ──────────────────────────────────────────────────────────────
  //  RENDER: INTRO & FEATURES
  // ──────────────────────────────────────────────────────────────
  function renderIntro(el) {
    const d = Model.get('intro') || {};
    el.innerHTML = `
      ${sectionHeader('📖','Intro & Features','The "Who We Are" story block and its 3 feature icons.')}
      <div class="card">
        <div class="card-header"><div class="card-title">📝 Story Content</div></div>
        <div class="form-grid cols-2">
          ${field('Section Tag','intro_tag', d.tag)}
          ${field('Heading','intro_heading', d.heading)}
        </div>
        <div class="form-grid">
          ${field('Paragraph 1','intro_p1', d.paragraph1,'textarea')}
          ${field('Paragraph 2','intro_p2', d.paragraph2,'textarea')}
          ${field('Image URL','intro_image', d.image,'text')}
          ${field('Badge Text','intro_badge', d.badgeText,'textarea')}
        </div>
        <div class="divider"></div>
        <button class="btn btn-primary" onclick="saveIntro()">💾 Save Intro</button>
      </div>
      <div class="card">
        <div class="card-header"><div class="card-title">🧩 Feature Items</div><button class="btn btn-ghost btn-sm" onclick="addFeature()">+ Add Feature</button></div>
        <div id="features-list">
          ${(d.features || []).map((f,i) => featureRow(f,i)).join('')}
        </div>
        <div class="divider"></div>
        <button class="btn btn-primary" onclick="saveFeatures()">💾 Save Features</button>
      </div>`;
  }
  function featureRow(f,i) {
    return `<div class="array-item" id="feature-${i}">
      <div class="array-item-header">
        <span class="array-item-label">🧩 Feature ${i+1}</span>
        <button class="btn btn-danger btn-xs" onclick="removeFeature(${i})">🗑 Remove</button>
      </div>
      <div class="form-grid cols-2">
        ${field('Icon (Font Awesome class)','feat_icon_'+i, f.icon)}
        ${field('Title','feat_title_'+i, f.title)}
      </div>
      ${field('Text','feat_text_'+i, f.text,'textarea')}
    </div>`;
  }
  function addFeature() {
    const d = Model.all();
    d.intro.features = d.intro.features || [];
    d.intro.features.push({ icon:'fas fa-star', title:'New Feature', text:'Feature description here.' });
    renderIntro(document.getElementById('main-content'));
  }
  function removeFeature(i) {
    const d = Model.all();
    d.intro.features.splice(i,1);
    renderIntro(document.getElementById('main-content'));
  }
  async function saveIntro() {
    const d = Model.all();
    d.intro.tag = val('intro_tag');
    d.intro.heading = val('intro_heading');
    d.intro.paragraph1 = val('intro_p1');
    d.intro.paragraph2 = val('intro_p2');
    d.intro.image = val('intro_image');
    d.intro.badgeText = val('intro_badge');
    try { await Model.save(d); showToast('Intro saved!'); }
    catch (err) { showToast('Error: ' + err.message, 'error'); }
  }
  async function saveFeatures() {
    const d = Model.all();
    d.intro.features = (d.intro.features || []).map((_,i) => ({
      icon: val('feat_icon_'+i), title: val('feat_title_'+i), text: val('feat_text_'+i)
    }));
    try { await Model.save(d); showToast('Features saved!'); }
    catch (err) { showToast('Error: ' + err.message, 'error'); }
  }

  // ──────────────────────────────────────────────────────────────
  //  RENDER: CORE VALUES
  // ──────────────────────────────────────────────────────────────
  function renderValues(el) {
    const d = Model.get('values') || {};
    el.innerHTML = `
      ${sectionHeader('💎','Core Values','The philosophy block and its 4 value cards.')}
      <div class="card">
        <div class="card-header"><div class="card-title">📝 Section Header</div></div>
        <div class="form-grid cols-2">
          ${field('Eyebrow','why_eyebrow', d.eyebrow)}
          ${field('Heading','why_heading', d.heading)}
        </div>
        ${field('Intro Text','why_intro', d.intro,'textarea')}
        <div class="divider"></div>
        <div class="form-grid cols-2">
          ${field('Main Image URL','why_img_main', d.imageMain)}
          ${field('Accent Image URL','why_img_accent', d.imageAccent)}

  // ──────────────────────────────────────────────────────────────
  //  ROUTER
  // ──────────────────────────────────────────────────────────────
  const ROUTES = {
    dashboard:    { label: 'Dashboard',          render: renderDashboard },
    hero:         { label: 'Hero',               render: renderHero },
    intro:        { label: 'Intro & Features',   render: renderIntro },
    values:       { label: 'Core Values',        render: renderValues },
    partners:     { label: 'Partners',           render: renderPartners },
    cta:          { label: 'CTA Banner',         render: renderCta },
    testimonials: { label: 'Testimonials',       render: renderTestimonials },
    footer:       { label: 'Footer',             render: renderFooter }
  };

  const Router = {
    current: 'dashboard',
    navigate(section, push = true) {
      if (!ROUTES[section]) section = 'dashboard';
      this.current = section;
      if (push) location.hash = '#' + section;
      document.querySelectorAll('.nav-item').forEach(el => el.classList.toggle('active', el.dataset.route === section));
      const route = ROUTES[section];
      document.getElementById('breadcrumb-section').textContent = route ? route.label : section;
      const main = document.getElementById('main-content');
      main.innerHTML = '';
      if (route && route.render) route.render(main);
      main.scrollTop = 0;
      closeSidebar();
    },
    init() {
      const h = location.hash.replace('#','') || 'dashboard';
      this.navigate(h, false);
      window.addEventListener('hashchange', () => this.navigate(location.hash.replace('#','') || 'dashboard', false));
    }
  };

  // ──────────────────────────────────────────────────────────────
  //  BOOT
  // ──────────────────────────────────────────────────────────────
  (async function boot() {
    await Model.load();
    Router.init();
  })();
